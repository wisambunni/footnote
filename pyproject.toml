[project]
name = "footnote"
version = "0.1.0"
description = "Hybrid retrieval over SEC filings — pgvector + Postgres FTS, XBRL facts in relational tables, MCP server for Claude Desktop."
readme = "README.md"
authors = [
    { name = "Wisam Bunni", email = "wisambbunni@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
footnote = "footnote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
