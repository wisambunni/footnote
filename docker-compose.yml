# Local Postgres + pgvector for footnote.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (deletes the volume = wipes all data)
services:
  db:
    # Postgres 17 with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg17
    container_name: footnote-db
    restart: unless-stopped
    env_file: .env
    ports:
      # host:container — connect from your Mac at localhost:${POSTGRES_PORT}
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # named volume: data survives `down`, wiped only by `down -v`
      - footnote_pgdata:/var/lib/postgresql/data
    healthcheck:
      # lets `docker compose up --wait` block until the DB actually accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  footnote_pgdata:
